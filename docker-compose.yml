services:
  api:
    build: .
    image: mail-triage-agent-api
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      # Localhost only: the API is unauthenticated and must not be reachable from the LAN.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      ollama:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      # Ready only after the model is pulled and warmed up (FR-003). urlopen raises on 503.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      # The first start pulls a ~2 GB model; failures during this window don't count as unhealthy.
      start_period: 15m
      start_interval: 5s
    restart: unless-stopped

  ollama:
    image: alpine/ollama:0.40.3
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama-models:/root/.ollama
    # No published port: the API reaches it on the compose network, and host port 11434
    # may already belong to a native Ollama.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.6
    environment:
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      # Web UI only; SMTP (1025) stays on the compose network.
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    # Healthcheck comes from the image (/mailpit readyz).
    restart: unless-stopped

volumes:
  ollama-models:
