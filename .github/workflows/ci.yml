name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only PR runs are superseded by newer pushes; every push to main gets checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          # Same uv as the Dockerfile. Python 3.11 comes from .python-version.
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker compose config -q
      # Proves the Dockerfile and uv.lock still build. No `up --wait`: that pulls the
      # ~2 GB model, and the faked-Ollama tests already cover readiness.
      - run: docker compose build api
