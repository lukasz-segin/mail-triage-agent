[project]
name = "mail-triage-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lukasz", email = "lukasz.segin1990@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.1",
    "langchain>=1.4.6",
    "langchain-ollama>=1.1.0",
    "ollama>=0.6.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
mail-triage-agent = "mail_triage_agent:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
markers = ["live: end-to-end tests against the running Compose stack (opt-in, LIVE_STACK=1)"]
